  - id: "DBLP:conf/tpctc/PoessRFD11"
    title: "A PDGF Implementation for TPC-H"
    authors:
      - "Meikel Poess"
      - "Tilmann Rabl"
      - "Michael Frank"
      - "Manuel Danisch"
    venue: "Topics in Performance Evaluation, Measurement and Characterization - Third TPC Technology Conference, TPCTC 2011, Seattle, WA, USA, August 29-September 3, 2011, Revised Selected Papers, 196-212"
    year: 2011
    type: "Conference Paper"
    abstract: >-
      With 182 benchmark results from 20 hardware vendors, TPC-H has established itself as the industry standard
      benchmark to measure performance of decision support systems. The release of TPC-H twelve years ago by the
      Transaction Processing Performance Council’s (TPC) was based on an earlier decision support benchmark, called
      TPC-D, which was released 1994. TPC-H inherited TPC-D’s data and query generators, DBgen and Qgen. As systems
      evolved over time, maintenance of these tools has become a major burden for the TPC. DBgen and Qgen need to be
      ported on new hardware architectures and adapted as the system grew in size to multiple terabytes. In this
      paper we demonstrate how Parallel Data Generation Framework (PDGF), a generic data generator, developed at the
      University of Passau for massively parallel data generation, can be adapted for TPC-H.
    doi: ""
    bibtex: |-
      @inproceedings{DBLP:conf/tpctc/PoessRFD11,
        abstract = {With 182 benchmark results from 20 hardware vendors, TPC-H has established itself as the industry standard benchmark to measure performance of decision support systems. The release of TPC-H twelve years ago by the Transaction Processing Performance Council’s (TPC) was based on an earlier decision support benchmark, called TPC-D, which was released 1994. TPC-H inherited TPC-D’s data and query generators, DBgen and Qgen. As systems evolved over time, maintenance of these tools has become a major burden for the TPC. DBgen and Qgen need to be ported on new hardware architectures and adapted as the system grew in size to multiple terabytes. In this paper we demonstrate how Parallel Data Generation Framework (PDGF), a generic data generator, developed at the University of Passau for massively parallel data generation, can be adapted for TPC-H.},
        author = {Poess, Meikel and Rabl, Tilmann and Frank, Michael and Danisch, Manuel},
        booktitle = {Topics in Performance Evaluation, Measurement and Characterization - Third {TPC} Technology Conference, {TPCTC} 2011, Seattle, WA, USA, August 29-September 3, 2011, Revised Selected Papers},
        crossref = {DBLP:conf/tpctc/2011},
        keywords = {TPCTC},
        pages = {196-212},
