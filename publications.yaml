  - id: "wang2024deco"
    title: "Deco: Fast and Accurate Decentralized Aggregation of Count-Based Windows in Large-Scale IoT Applications"
    authors:
      - "Yue Wang"
      - "Rafael Moczalla"
      - "Manisha Luthra"
      - "Tilmann Rabl"
    venue: "27th International Conference on Extending Database Technology (EDBT ’24)"
    year: 2024
    type: "Conference Paper"
    abstract: >-
      Aggregating count-based windows in large-scale Internet-of-Things applications is challenging. Centralized
      methods are slow, while decentralized methods may be inaccurate. Deco balances speed and precision in
      distributed stream processing through a lightweight prediction method that derives local window sizes from
      previously observed event rates and performs corrections when necessary. Windows are processed on local nodes,
      verified for correctness, and aggregated at a root node. Evaluation shows that Deco reduces network traffic by
      up to 99%, scales linearly with the number of nodes, and substantially outperforms centralized methods.
