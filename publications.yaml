  - id: "poess2018analysis"
    title: "Analysis of TPCx-IoT: The First Industry Standard Benchmark for IoT Gateway Systems"
    authors:
      - "Meikel Poess"
      - "Raghunath Nambiar"
      - "Karthik Kulkarni"
      - "Chinmayi Narasimhadevara"
      - "Tilmann Rabl"
      - "Hans-Arno Jacobsen"
    venue: "34th IEEE International Conference on Data Engineering, ICDE 2018, Paris, France, April 16-19, 2018, 1519-1530"
    year: 2018
    type: "Conference Paper"
    abstract: >-
      By 2020 it is estimated that 20 billion devices will be connected to the Internet. While the initial hype
      around this Internet of Things (IoT) stems from consumer use cases, the number of devices and data from
      enterprise use cases is significant in terms of market share. With companies being challenged to choose the
      right digital infrastructure from different providers, there is an pressing need to objectively measure the
      hardware, operating system, data storage, and data management systems that can ingest, persist, and process
      the massive amounts of data arriving from sensors (edge devices). The Transaction Processing Performance
      Council (TPC) recently released the first industry standard benchmark for measuring the performance of gateway
      systems, TPCx-IoT. In this paper, we provide a detailed description of TPCx-IoT, mention design decisions
      behind key elements of this benchmark, and experimentally analyze how TPCx-IoT measures the performance of IoT
      gateway systems.
