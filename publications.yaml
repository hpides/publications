  - id: "ICDT2022-KMSSSW"
    title: "Discovering Event Queries from Traces: Laying Foundations for Subsequence-Queries with Wildcards and Gap-Size Constraints"
    authors:
      - "Sarah Kleest-Meißner"
      - "Rebecca Sattler"
      - "Markus L. Schmid"
      - "Nicole Schweikardt"
      - "Matthias Weidlich"
    venue: "25th International Conference on Database Theory (ICDT), 18:1-18:21"
    year: 2022
    type: "Conference Paper"
    abstract: >-
      We introduce subsequence-queries with wildcards and gap-size constraints (swg-queries, for short) as a tool for querying event traces. An swg-query q is given by a string s over an alphabet of variables and types, a global window size w, and a tuple c = ((c_1^−,c_1^+),(c_2^−,c_2^+),...,(c_{|s|−1}^-, c_{|s|−1}^+)) of local gap-size constraints over N × (N ∪ {∞}). The query q matches in a trace t (i. e., a sequence of types) if the variables can uniformly be substituted by types such that the resulting string occurs in t as a subsequence that spans an area of length at most w, and the ith gap of the subsequence (i. e., the distance between the ith and (i+1)th position of the subsequence) has length at least c_i^- and at most c_i^+.

      We formalise and investigate the task of discovering an swg-query that describes best the traces from a given sample S of traces, and we present an algorithm solving this task. As a central component, our algorithm repeatedly solves the matching problem (i. e., deciding whether a given query q matches in a given trace t), which is an NP-complete problem (in combined complexity). Hence, the matching problem is of special interest in the context of query discovery, and we therefore subject it to a detailed (parameterised) complexity analysis to identify tractable subclasses, which lead to tractable subclasses of the discovery problem as well. We complement this by a reduction proving that any query discovery algorithm also yields an algorithm for the matching problem. Hence, lower bounds on the complexity of the matching problem directly translate into according lower bounds of the query discovery problem. As a proof of concept, we also implemented a prototype of our algorithm and tested it on real-world data.
    doi: "10.4230/LIPIcs.ICDT.2022.18"
