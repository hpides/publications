  - id: "DBLP:conf/wbdb/RablGHCRPJ12"
    title: "BigBench Specification V0.1 - BigBench: An Industry Standard Benchmark for Big Data Analytics"
    authors:
      - "Tilmann Rabl"
      - "Ahmad Ghazal"
      - "Minqing Hu"
      - "Alain Crolotte"
      - "Francois Raab"
      - "Meikel Poess"
      - "Hans-Arno Jacobsen"
    venue: "Specifying Big Data Benchmarks - First Workshop, WBDB 2012, San Jose, CA, USA, May 8-9, 2012, and Second Workshop, WBDB 2012, Pune, India, December 17-18, 2012, Revised Selected Papers, 164-201"
    year: 2012
    type: "Workshop Paper"
    abstract: >-
      In this article, we present the specification of BigBench, an end-to-end big data benchmark proposal. BigBench
      models a retail product supplier. The benchmark proposal covers a data model and a set of big data specific
      queries. BigBench’s synthetic data generator addresses the variety, velocity and volume aspects of big data
      workloads. The structured part of the BigBench data model is adopted from the TPC-DS benchmark. In addition,
      the structured schema is enriched with semi-structured and unstructured data components that are common in a
      retail product supplier environment. This specification contains the full query set as well as the data model.
