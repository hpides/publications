  - id: "DBLP:conf/tpctc/RablFSK10"
    title: "A Data Generator for Cloud-Scale Benchmarking"
    authors:
      - "Tilmann Rabl"
      - "Michael Frank"
      - "Hatem Mousselly Sergieh"
      - "Harald Kosch"
    venue: "Performance Evaluation, Measurement and Characterization of Complex Systems - Second TPC Technology Conference, TPCTC 2010, Singapore, September 13-17, 2010. Revised Selected Papers, 41-56"
    year: 2010
    type: "Conference Paper"
    abstract: >-
      In many fields of research and business data sizes are breaking the petabyte barrier. This imposes new
      problems and research possibilities for the database community. Usually, data of this size is stored in large
      clusters or clouds. Although clouds have become very popular in recent years, there is only little work on
      benchmarking cloud applications. In this paper we present a data generator for cloud sized applications. Its
      architecture makes the data generator easy to extend and to configure. A key feature is the high degree of
      parallelism that allows linear scaling for arbitrary numbers of nodes. We show how distributions,
      relationships and dependencies in data can be computed in parallel with linear speed up.
