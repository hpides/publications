  - id: "SchmellerNZR2024"
    title: "Towards A GPU-Accelerated Stream Processing Engine Through Query Compilation"
    authors:
      - "Florian Schmeller"
      - "Dwi P. A. Nugroho"
      - "Steffen Zeuch"
      - "Tilmann Rabl"
    venue: "Lernen, Wissen, Daten, Analysen. (LWDA '24)"
    year: 2024
    type: "Conference Paper"
    abstract: >-
      Over the last decade, data stream processing has emerged to provide real-time insights into large, unbounded
      volumes of data. At the same time, graphics processing units (GPU) have become an important accelerator for
      improving the performance of compute-bound applications. Nevertheless, state-of-the-art data streaming systems
      opt to scale-out and typically do not make efficient use of the underlying hardware. Recent work has shown
      that query compilation is a viable technique to support hardware advancements in query processing engines.
      However, it often comes with high development and maintenance costs. In particular, when the process involves
      hardware accelerators such as GPUs. In this paper, we propose a framework for compiling data stream queries to
      efficient GPU code in a developer-friendly manner. We demonstrate the feasibility of our framework by
      integrating it into the data management system NebulaStream. Our experiments show that frequent memory
      transfers between CPU and GPU impact the query processing throughput.
