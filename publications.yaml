  - id: "schlosser2019automatedrepricing"
    title: "Automated repricing and ordering strategies in competitive markets"
    authors:
      - "Rainer Schlosser"
      - "Carsten Walther"
      - "Martin Boissier"
      - "Matthias Uflacker"
    venue: "AI Communications"
    year: 2019
    type: "Journal Paper"
    abstract: >-
      Merchants on modern e-commerce platforms face a highly competitive environment. They compete against each other
      using automated dynamic pricing and ordering strategies. Successfully managing both inventory levels as well as
      offer prices is a challenging task as (i) demand is uncertain, (ii) competitors strategically interact, and (iii)
      optimized pricing and ordering decisions are mutually dependent. We show how to derive optimized data-driven
      pricing and ordering strategies which are based on demand learning techniques and efficient dynamic optimization
      models. We verify the superior performance of our self-adaptive strategies by comparing them to different
      rule-based as well as data-driven strategies in duopoly and oligopoly settings. Further, to study and to optimize
      joint dynamic ordering and pricing strategies on online marketplaces, we built an interactive simulation platform.
      To be both flexible and scalable, the platform has a microservice-based architecture and allows handling dozens of
      competing merchants and streams of consumers with configurable characteristics.
