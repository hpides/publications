  - id: "DBLP:conf/tpctc/RablLHSK09"
    title: "Generating Shifting Workloads to Benchmark Adaptability in Relational Database Systems"
    authors:
      - "Tilmann Rabl"
      - "Andreas Lang"
      - "Thomas Hackl"
      - "Bernhard Sick"
      - "Harald Kosch"
    venue: "Performance Evaluation and Benchmarking, First TPC Technology Conference, TPCTC 2009, Lyon, France, August 24-28, 2009, Revised Selected Papers, 116-131"
    year: 2009
    type: "Conference Paper"
    abstract: >-
      A large body of research concerns the adaptability of database systems. Many commercial systems already
      contain autonomic processes that adapt configurations as well as data structures and data organization. Yet
      there is virtually no possibility for a just measurement of the quality of such optimizations. While standard
      benchmarks have been developed that simulate real-world database applications very precisely, none of them
      considers variations in workloads produced by human factors. Today’s benchmarks test the performance of
      database systems by measuring peak performance on homogeneous request streams. Nevertheless, in systems with
      user interaction access patterns are constantly shifting. We present a benchmark that simulates a web
      information system with interaction of large user groups. It is based on the analysis of a real online
      eLearning management system with 15,000 users. The benchmark considers the temporal dependency of user
      interaction. Main focus is to measure the adaptability of a database management system according to shifting
      workloads. We will give details on our design approach that uses sophisticated pattern analysis and data
      mining techniques.
    doi: ""
