    abstract: >-
      Standardized benchmarks are crucial for fair performance comparisons, but they generally use workloads that are
      well defined and known in advance. This has encouraged excessive tuning for benchmarks such as TPC-H and TPC-C,
      so results may not reflect system behavior under variable real-world workloads. The paper introduces surprise
      benchmarking as a complementary approach in which unknown queries are exercised during evaluation. The method
