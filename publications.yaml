  - id: "DBLP:conf/wbdb/RablJ12"
    title: "Big Data Generation"
    authors:
      - "Tilmann Rabl"
      - "Hans-Arno Jacobsen"
    venue: "Specifying Big Data Benchmarks - First Workshop, WBDB 2012, San Jose, CA, USA, May 8-9, 2012, and Second Workshop, WBDB 2012, Pune, India, December 17-18, 2012, Revised Selected Papers, 20-27"
    year: 2012
    type: "Workshop Paper"
    abstract: >-
      Big data challenges are end-to-end problems. When handling big data it usually has to be preprocessed, moved,
      loaded, processed, and stored many times. This has led to the creation of big data pipelines. Current
      benchmarks related to big data only focus on isolated aspects of this pipeline, usually the processing,
      storage and loading aspects. To this date, there has not been any benchmark presented covering the end-to-end
      aspect for big data systems. In this paper, we discuss the necessity of ETL like tasks in big data
      benchmarking and propose the Parallel Data Generation Framework (PDGF) for its data generation. PDGF is a
      generic data generator that was implemented at the University of Passau and is currently adopted in TPC
      benchmarks.
