  - id: "strassenburg_2023_m3lib"
    title: "Efficient Multi-Model Management"
    authors:
      - "Nils Strassenburg"
      - "Dominic Kupfer"
      - "Julia Kowal"
      - "Tilmann Rabl"
    venue: "26th International Conference on Extending Database Technology (EDBT '23)"
    year: 2023
    type: "Conference Paper"
    abstract: >-
      Deep Learning models are deployed in an increasing number of industrial domains, such as retail and automotive
      applications. An instance of a model typically performs one specific task, which is why larger software
      systems use multiple models in parallel. Given that all models in production software have to be managed, this
      leads to the problem of managing sets of related models, i.e., multi-model management. Existing approaches
      perform poorly on this task because they are optimized for saving single large models but not for
      simultaneously saving a set of related models. In this paper, we explore the space of multi-model management
      by presenting three optimized approaches: (1) A baseline approach that saves full model representations and
      minimizes the amount of saved metadata. (2) An update approach that reduces the storage consumption compared
      to the baseline by saving parameter updates instead of full models. (3) A provenance approach that saves model
      provenance data instead of model parameters. We evaluate the approaches for the multi-model management use
      cases of managing car battery cell models and image classification models. Our results show that the baseline
      outperforms existing approaches for save and recover times by more than an order of magnitude and that more
      sophisticated approaches reduce the storage consumption by up to 99%.
