  - id: "riekenbrauck2024buffermanager"
    title: "A Three-Tier Buffer Manager Integrating CXL Device Memory for Database Systems"
    authors:
      - "Niklas Riekenbrauck"
      - "Marcel Weisgut"
      - "Daniel Lindner"
      - "Tilmann Rabl"
    venue: "Joint International Workshop on Big Data Management on Emerging Hardware and Data Management on Virtualized Active Systems @ ICDE 2024"
    year: 2024
    type: "Workshop Paper"
    abstract: >-
      Compute Express Link (CXL) connects byte-addressable device memory to a CPU and allows database data to reside
      in local memory, CXL device memory, and persistent disk storage. Existing three-tier buffer managers for
      persistent memory rely on invasive pointer swizzling. This work presents a three-tier buffer manager for CXL
      device memory that combines hardware-supported virtual memory for page translation with a probabilistic page
      migration policy. Experiments on a CXL Type 3 device prototype with YCSB-based workloads show that expanding a
      server with CXL device memory can keep more data in memory and reduce spilling to slower disk storage.
