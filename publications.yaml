  - id: "DBLP:conf/eenergy/RablDK10"
    title: "Introducing Scalileo: A Java Based Scaling Framework"
    authors:
      - "Tilmann Rabl"
      - "Christian Dellwo"
      - "Harald Kosch"
    venue: "Proceedings of the 1st International Conference on Energy-Efficient Computing and Networking, e-Energy 2010, Passau, Germany, April 13-15, 2010, 205–214"
    year: 2010
    type: "Conference Paper"
    abstract: >-
      Scalability is a major concern of internet based applications. Access peaks that overload the application are
      a financial risk. Therefore, systems are built to scale. They are usually configured to be able to process
      peaks at any give moment. This can be very inefficient. Yet, there are various ways to improve efficiency. One
      reasonable approach is to scale applications according to their current workload. This requires the
      possibility to scale a system up and down. In this paper we present an scaling framework for Java
      applications. It allows not only autonomic scaling, but also migration of distributed applications. We will
      then show how energy efficiency can be increased by scaling applications. To present an example we have used
      our framework to autonomically scale a web server cluster.
