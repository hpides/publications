    venue: "28th International Conference on Extending Database Technology (EDBT), 935–948"
    year: 2025
    type: "Conference Paper"
    abstract: >-
      Data processing systems are increasingly deployed in the cloud. Recent systems use disaggregated compute and
      storage, while serverless compute services such as AWS Lambda enable finer-grained elastic scalability. Prior
      work demonstrates the viability of serverless infrastructure for scalable data processing but identifies
      limitations from performance variance and cost overhead, particularly in networking and storage. This paper
      analyzes the performance and cost characteristics of serverless infrastructure through microbenchmarks across
      compute and storage services and through end-to-end workloads. Using the Skyrise evaluation platform, it
      identifies boundaries for performance variability in AWS serverless networks and storage and presents cost
      break-even points that indicate when serverless resources can be used efficiently for data processing.
