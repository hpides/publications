  - id: "boissier2018partitioning"
    title: "Workload-Driven Horizontal Partitioning and Pruning for Large HTAP Systems"
    authors:
      - "Martin Boissier"
      - "Kurzynski Daniel"
    venue: "Proceedings of the International Conference on Data Engineering Workshops (ICDE Workshops)"
    year: 2018
    type: "Workshop Paper"
    abstract: >-
      Modern server systems with large NUMA architectures necessitate (i) data being distributed over the available
      computing nodes and (ii) NUMA-aware query processing to enable effective parallel processing in database systems.
      As these architectures incur significant latency and throughout penalties for accessing non-local data, queries
      should be executed as close as possible to the data. To further increase both performance and efficiency, data
      that is not relevant for the query result should be skipped as early as possible. One way to achieve this goal is
      horizontal partitioning to improve static partition pruning. As part of our ongoing work on workload-driven
      partitioning, we have implemented a recent approach called aggressive data skipping and extended it to handle both
      analytical as well as transactional access patterns. In this paper, we evaluate this approach with the workload
      and data of a production enterprise system of a Global 2000 company. The results show that over 80% of all tuples
      can be skipped in average while the resulting partitioning schemata are surprisingly stable over time.
