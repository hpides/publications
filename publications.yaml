  - id: "zimmermann2017ebayfraud"
    title: "Detecting Fraudulent Advertisements on a Large E-Commerce Platform"
    authors:
      - "Tim Zimmermann"
      - "Timo Djürken"
      - "Arne Mayer"
      - "Michael Janke"
      - "Martin Boissier"
      - "Christian Schwarz"
      - "Rainer Schlosser"
      - "Matthias Uflacker"
    venue: "Proceedings of the Workshops of the EDBT/ICDT Joint Conference (DOLAP Workshop)"
    year: 2017
    type: "Workshop Paper"
    abstract: >-
      E-commerce platforms face the challenge of eﬃciently and accurately detecting fraudulent activity every day.
      Manually checking every advertisement for fraud does not scale and is financially unviable. By using automated
      learning algorithms, we can drastically reduce the number of advertisements that need to be checked by humans. In
      this paper, we present the results of a joint project with a large ecommerce company selling used goods. Using our
      partner’s advertisement data, we implemented several classification approaches to automatically recognize
      fraudulent activity. With the help of the proposed fraud detection, customer service agents only need to check
      about 8% of all advertisements manually for fraud. Simultaneously, we detect more than 93% of all fraudulent
      advertisements.
