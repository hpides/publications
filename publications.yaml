  - id: "DBLP:conf/wbdb/ChowdhuryRSDJ13"
    title: "A BigBench Implementation in the Hadoop Ecosystem"
    authors:
      - "Badrul Chowdhury"
      - "Tilmann Rabl"
      - "Pooya Saadatpanah"
      - "Jiang Du"
      - "Hans-Arno Jacobsen"
    venue: "Advancing Big Data Benchmarks - Proceedings of the 2013 Workshop Series on Big Data Benchmarking, WBDB.cn, Xi'an, China, July 16-17, 2013 and WBDB.us, San José, CA, USA, October 9-10, 2013 Revised Selected Papers, 3-18"
    year: 2013
    type: "Workshop Paper"
    abstract: >-
      BigBench is the first proposal for an end to end big data analytics benchmark. It features a rich query set
      with complex, realistic queries. BigBench was developed based on the decision support benchmark TPC-DS. The
      first proof-of-concept implementation was built for the Teradata Aster parallel database system and the
      queries were formulated in the proprietary SQL-MR query language. To test other other systems, the queries
      have to be translated. In this paper, an alternative implementation of BigBench for the Hadoop ecosystem is
      presented. All 30 queries of BigBench were realized using Apache Hive, Apache Hadoop, Apache Mahout, and NLTK.
      We will present the different design choices we took and show a proof of concept evaluation.
