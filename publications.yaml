  - id: "maltenberger_2022_pmem_join"
    title: "Evaluating In-Memory Hash-Joins on Persistent Memory"
    authors:
      - "Tobias Maltenberger"
      - "Till Lehmann"
      - "Lawrence Benson"
      - "Tilmann Rabl"
    venue: "25th International Conference on Extending Database Technology (EDBT '22)"
    year: 2022
    type: "Conference Paper"
    abstract: >-
      Steady advances in processor and memory technologies have driven continuous tuning and redesigning of
      in-memory hash-joins for decades. Over the years, research has shown advantages of both hardware-conscious
      radix-joins and hardware-oblivious joins, without a clear winner. In this paper, we evaluate them on
      persistent memory (PMem) as an emerging memory technology that offers close-to-DRAM speed while offering
      significantly higher capacity. We evaluate the no partitioning join (NPO) and the parallel radix join (PRO) on
      PMem and show how their performance differs from DRAM-based execution. Our results show that while PRO is
      always at least as fast as NPO in DRAM, this does not hold for PMem, where NPO outperforms PRO by up to 1.7x.
      Based on our findings, we provide an outlook into key design choices for future PMem-optimized join
      implementations.
