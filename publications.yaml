  - id: "boissier2019compression"
    title: "Workload-Driven and Robust Selection of Compression Schemes for Column Stores"
    authors:
      - "Martin Boissier"
      - "Max Jendruk"
    venue: "Proceedings of the International Conference on Extending Database Technology (EDBT)"
    year: 2019
    type: "Conference Paper"
    abstract: >-
      Modern main memory-optimized column stores employ a variety of compression techniques. Deciding for one
      compression technique over others for a given memory budget can be challenging since each technique has different
      trade-offs whose impact on large workloads is not obvious. We present an automated selection framework for
      compression configurations. Most database systems provide means to automatically choose a compression
      configuration but lack two crucial properties: The compression selection cannot be constrained (e.g., by a given
      storage budget) and robustness of the compression configuration is not considered. Our approach uses workload
      information to determine robust configurations under the given constraints. The runtime performance of the various
      compression techniques is estimated using adapted regression models.
