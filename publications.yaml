        author = {Rabl, Tilmann and Sadoghi, Mohammad and Jacobsen, Hans{-}Arno and G{{ó}}mez{-}Villamor, Sergio and Munt{{é}}s{-}Mulero, Victor and Mankowskii, Serge},
