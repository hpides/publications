  - id: "DBLP:conf/wbdb/DoblanderRJ12"
    title: "Processing Big Events with Showers and Streams"
    authors:
      - "Christoph Doblander"
      - "Tilmann Rabl"
      - "Hans-Arno Jacobsen"
    venue: "Specifying Big Data Benchmarks - First Workshop, WBDB 2012, San Jose, CA, USA, May 8-9, 2012, and Second Workshop, WBDB 2012, Pune, India, December 17-18, 2012, Revised Selected Papers, 60-71"
    year: 2012
    type: "Workshop Paper"
    abstract: >-
      Emerging use cases derived from the area of cloud computing, smart power grids, and business process
      management require a set of capabilities not met by traditional event processing systems. These use cases were
      chosen to illustrate the capabilities required from systems that are able to process what we refer to as Big
      Events, that is Big Data in motion. To further illustrate Big Events, we identify three use cases and analyze
      the characteristics of the events involved. Based on this analysis, we specify requirements regarding the
      event schema, event query language, historic event processing needs, event timing, and result accuracy.
      Collectively, we refer to the constellation of state changes in a given system that exhibits these
      characteristics as event showers, referring to the collective of these events, similar to the notion of an
      event stream in the context of event stream processing. We call systems that offer capabilities for meeting
      these requirements event shower processing systems in contrast to traditional event (stream) processing
      systems. The use cases we picked, demonstrate that additional value can be captured by having shower
      processing systems in place. The benefits lie in the new possibilities to gain additional insights, increase
      observability, and to further exert control and opportunities for optimizations in the given applications.
