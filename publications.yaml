  - id: "DBLP:conf/btw/RablSFK09"
    title: "Demonstration des Parallel Data Generation Framework"
    authors:
      - "Tilmann Rabl"
      - "Hatem Mousselly Sergieh"
      - "Michael Frank"
      - "Harald Kosch"
    venue: "Datenbanksysteme für Business, Technologie und Web (BTW), 14. Fachtagung des GI-Fachbereichs \"Datenbanken und Informationssysteme\" (DBIS), 2.-4.3.2011 in Kaiserslautern, Germany, 730-733"
    year: 2011
    type: "Demonstration"
    abstract: >-
      In vielen akademischen und wirtschaftlichen Anwendungen durchbrechen die Datenmengen die Petabytegrenze. Dies
      stellt die Datenbankforschung vor neue Aufgaben und Forschungsfelder. Petabytes an Daten werden gewöhnlich in
      großen Clustern oder Clouds gespeichert. Auch wenn Clouds in den letzten Jahren sehr popul̈är geworden sind,
      gibt es dennoch wenige Arbeiten zum Benchmarking von Anwendungen in Clouds. In diesem Beitrag stellen wir
      einen Datengenerator vor, der für die Generierung von Daten in Clouds entworfen wurde. Die Architektur des
      Generators ist auf einfache Erweiterbarkeit und Konfigurierbarkeit ausgelegt. Die wichtigste Eigenschaft ist
      die vollständige Parallelverarbeitung, die einen optimalen Speedup auf einer beliebigen Anzahl an
      Rechnerknoten erlaubt. Die Demonstration umfasst sowohl die Erstellung eines Schemas, als auch die Generierung
      mit verschiedenen Parallelisierungsgraden. Um Interessenten die Definition eigener Datenbanken zu ermöglichen,
      ist das Framework auch online verfügbar.
