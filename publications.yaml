  - id: "DBLP:conf/mm/HolblingRK07"
    title: "Intertainment"
    authors:
      - "Günther Hölbling"
      - "Tilmann Rabl"
      - "Harald Kosch"
    venue: "Proceedings of the 15th International Conference on Multimedia 2007, Augsburg, Germany, September 24-29, 2007, 475-476"
    year: 2007
    type: "Conference Paper"
    abstract: >-
      Traditional TV provides only a very passive experience. Recent trends suggest that users would be interested
      in taking a more active role while watching TV. This demo paper presents the Interactive television (iTV)
      platform, which offers a solution in giving the TV-audience a chance of active participation. The iTV platform
      enriches TV with additional content and interactivity, making it more attractive for the audience. In order to
      support multi-user and personalized access to the iTV services mobile devices are used. To provide an easy way
      to offer and use services an ad-hoc service architecture - the Universal Plug and Play (UPnP) architecture -
      has been used.
