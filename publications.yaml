  - id: "damme2022daphne"
    title: "DAPHNE: An Open and Extensible System Infrastructure for Integrated Data Analysis Pipelines"
    authors:
      - "Patrick Damme"
      - "Marius Birkenbach"
      - "Constatinos Bitsakos"
      - "Matthias Boehm"
