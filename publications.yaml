  - id: "grulich2020grizzly"
    title: "Grizzly: Efficient Stream Processing Through Adaptive Query Compilation"
    authors:
      - "Philipp M. Grulich"
      - "Sebastian Breß"
      - "Steffen Zeuch"
      - "Jonas Traub"
      - "Janis von Bleichert"
      - "Zongxiong Chen"
      - "Tilmann Rabl"
      - "Volker Markl"
    venue: "ACM SIGMOD/PODS International Conference on Management of Data, Portland, OR, USA"
    year: 2020
    type: "Conference Paper"
    abstract: >-
      Stream Processing Engines (SPEs) execute long-running queries on unbounded data streams. They rely on managed
      runtimes, an interpretation-based processing model, and do not perform runtime optimizations. Recent research
      states that this limits the utilization of modern hardware and neglects changing data characteristics at
      runtime. In this paper, we present Grizzly, a novel adaptive query compilation-based SPE to enable highly
      efficient query execution on modern hardware. We extend query-compilation and task-based parallelization for
      the unique requirements of stream processing and apply adaptive compilation to enable runtime
      re-optimizations. The combination of light-weight statistic gathering with just-in-time compilation enables
      Grizzly to dynamically adjust to changing data-characteristics at runtime. Our experiments show that Grizzly
      achieves up to an order of magnitude higher throughput and lower latency compared to state-of-the-art
      interpretation-based SPEs.
