  - id: "DBLP:conf/sigmod/GhazalRHRPCJ13"
    title: "BigBench: Towards an Industry Standard Benchmark for Big Data Analytics"
    authors:
      - "Ahmad Ghazal"
      - "Tilmann Rabl"
      - "Minqing Hu"
      - "Francois Raab"
      - "Meikel Poess"
      - "Alain Crolotte"
      - "Hans-Arno Jacobsen"
    venue: "Proceedings of the ACM SIGMOD International Conference on Management of Data, SIGMOD 2013, New York, NY, USA, June 22-27, 2013, 1197-1208"
    year: 2013
    type: "Conference Paper"
    abstract: >-
      There is a tremendous interest in big data by academia, industry and a large user base. Several commercial and
      open source providers unleashed a variety of products to support big data storage and processing. As these
      products mature, there is a need to evaluate and compare the performance of these systems. In this paper, we
      present BigBench, an end-to-end big data benchmark proposal. The underlying business model of BigBench is a
      product retailer. The proposal covers a data model and synthetic data generator that addresses the variety,
      velocity and volume aspects of big data systems containing structured, semi-structured and unstructured data.
      The structured part of the BigBench data model is adopted from the TPC-DS benchmark, which is enriched with
      semi-structured and unstructured data components. The semi-structured part captures registered and guest user
      clicks on the retailer’s website. The unstructured data captures product reviews submitted online. The data
      generator designed for BigBench provides scalable volumes of raw data based on a scale factor. The BigBench
      workload is designed around a set of queries against the data model. From a business prospective, the queries
      cover the different categories of big data analytics proposed by McKinsey. From a technical prospective, the
      queries are designed to span three different dimensions based on data sources, query processing types and
      analytic techniques. We illustrate the feasibility of BigBench by implementing it on the Teradata Aster
      Database. The test includes generating and loading a 200 Gigabyte BigBench data set and testing the workload
      by executing the BigBench queries (written using Teradata Aster SQL-MR) and reporting their response times.
