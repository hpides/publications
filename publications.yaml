  - id: "DBLP:conf/tpctc/IvanovRPQPPB15"
    title: "Big Data Benchmark Compendium"
    authors:
      - "Todor Ivanov"
      - "Tilmann Rabl"
      - "Meikel Poess"
      - "Anna Queralt"
      - "John Poelman"
      - "Nicolás Poggi"
      - "Jeffrey Buell"
    venue: "Performance Evaluation and Benchmarking: Traditional to Big Data to Internet of Things - 7th TPC Technology Conference, TPCTC 2015, Kohala Coast, HI, USA, August 31 - September 4, 2015. Revised Selected Papers, 135-155"
    year: 2015
    type: "Conference Paper"
    abstract: >-
      The field of Big Data and related technologies is rapidly evolving. Consequently, many benchmarks are
      emerging, driven by academia and industry alike. As these benchmarks are emphasizing different aspects of Big
      Data and, in many cases, covering different technical platforms and uses cases, it is extremely difficult to
      keep up with the pace of benchmark creation. Also with the combinations of large volumes of data,
      heterogeneous data formats and the changing processing velocity, it becomes complex to specify an architecture
      which best suits all application requirements. This makes the investigation and standardization of such
      systems very difficult. Therefore, the traditional way of specifying a standardized benchmark with pre-defined
      workloads, which have been in use for years in the transaction and analytical processing systems, is not
      trivial to employ for Big Data systems. This document provides a summary of existing benchmarks and those that
      are in development, gives a side-by-side comparison of their characteristics and discusses their pros and
      cons. The goal is to understand the current state in Big Data benchmarking and guide practitioners in their
      approaches and use cases.
