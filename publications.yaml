  - id: "das2026smartrabbit"
    title: "SmartRabbit: An Interactive Query Processor"
    authors:
      - "Pratyoy Das"
      - "Martin Boissier"
      - "Kyoungmin Kim"
      - "Sharad Mehrotra"
      - "Tilmann Rabl"
    venue: "Proceedings of the ACM on Management of Data (PACMMOD, SIGMOD), vol. 4(3), 235:1–235:25"
    year: 2026
    type: "Conference Paper"
    abstract: >-
      Traditional relational database systems optimize analytical queries to minimize their end-to-end latency. The
      resulting optimal plans are usually blocking, forcing users to wait until full query completion before seeing
      any results. This execution model precludes interactivity: users cannot observe partial results or gain early
      insights for long-running queries. Query optimizers rarely choose plans that promote interactivity, since such
      plans either incur prohibitively large latencies or involve operators for which interactive alternatives are
      often infeasible. This paper introduces SmartRabbit, an interactive query processor that promotes interactivity
      of answers while matching the end-to-end latency of blocking execution plans. It first designs a plan optimized
      for interactivity and then simultaneously executes this plan alongside a traditional blocking plan. The two
      executions are synchronized to maintain the correct order of answers and prevent duplicates. Experiments in a
      scalable open-source database system show that SmartRabbit consistently delivers early and continuous results
      across analytical benchmarks, data scales, and levels of parallelism, with only marginal latency overhead.
    doi: "10.1145/3802112"
    bibtex: |-
