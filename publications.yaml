        author = {Rabl, Tilmann and Poess, Meikel and Jacobsen, Hans{-}Arno and O'Neil, Patrick E. and O'Neil, Elizabeth J.},
        booktitle = {{ACM/SPEC} International Conference on Performance Engineering, ICPE'13, Prague, Czech Republic - April 21 - 24, 2013},
