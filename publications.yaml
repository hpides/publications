  - id: "rabl2019adabench"
    title: "ADABench - Towards an Industry Standard Benchmark for Advanced Anayltics"
    authors:
      - "Tilmann Rabl"
      - "Christoph Brücke"
      - "Philipp Härtling"
      - "Stella Stars"
      - "Rodrigo Escobar Palacios"
      - "Hamesh Patel"
      - "Satyam Srivastava"
      - "Christoph Boden"
      - "Jens Meiners"
      - "Sebastian Schelter"
    venue: ""
    year: 2019
    type: "Journal Paper"
    abstract: >-
      The digital revolution, rapidly decreasing storage cost, and remarkable results achieved by state of the art
      machine learning (ML) methods are driving widespread adoption of ML approaches. While notable recent efforts
      to benchmark ML methods for canonical tasks exist, none of them address the challenges arising with the
      increasing pervasiveness of end-to-end ML deployments. The challenges involved in successfully applying ML
      methods in diverse enterprise settings extend far beyond efficient model training. In this paper, we present
      our work in benchmarking advanced data analytics systems and lay the foundation towards an industry standard
      machine learning benchmark. Unlike previous approaches, we aim to cover the complete end-to-end ML pipeline
      for diverse, industry-relevant application domains rather than evaluating only training performance. To this
      end, we present reference implementations of complete ML pipelines including corresponding metrics and run
      rules, and evaluate them at different scales in terms of hardware, software, and problem size.
