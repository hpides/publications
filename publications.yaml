  - id: "baeuerle2025tco2"
    title: "TCO2: Analyzing the Carbon Footprint of Database Server Replacements"
    authors:
      - "Marc Baeuerle"
      - "Thomas Bodner"
      - "Martin Boissier"
      - "Tilmann Rabl"
      - "Ricardo Salazar-Díaz"
      - "Florian Schmeller"
      - "Nils Strassenburg"
      - "Ilin Tolovski"
      - "Marcel Weisgut"
      - "Wang Yue"
    venue: "Proceedings of the VLDB Endowment"
    year: 2025
    type: "Demonstration"
    abstract: >-
      Data centers produce a significant and increasing amount of CO2 emissions. In the past, these have been
      predominantly due to energy generation for powering data centers. With the transition to energy sources with lower
      carbon production, the embodied carbon (i.e., CO2 and other greenhouse gas emissions during production, transport,
      and end-of-life) plays an increasing role when planning server lifecycles. While replacing an old server with
      newer hardware will typically reduce the power consumption of individual tasks, due to better efficiency of modern
      CPUs, offsetting the embodied carbon of new hardware can take months to tens of years, depending on the grid
      carbon intensity. In this demo, we invite attendees to interactively analyze the ecological lifecycles of modern
      database servers for different workloads and grid carbon intensities. Attendees can compare servers with different
      CPU architectures and estimate ecological deployment cycles for database servers.
    doi: "10.14778/3750601.3750604"
