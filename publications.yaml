  - id: "kossmann2021cockpit"
    title: "A Cockpit for the Development and Evaluation of Autonomous Database Systems"
    authors:
      - "Jan Kossmann"
      - "Martin Boissier"
      - "Alexander Dubrawski"
      - "Fabian Heseding"
      - "Caterina Mandel"
      - "Udo Pigorsch"
      - "Max Schneider"
      - "Til Schniese"
      - "Mona Sobhani"
      - "Petr Tsayun"
      - "Katharina Wille"
      - "Michael Perscheid"
      - "Matthias Uflacker"
      - "Hasso Plattner"
    venue: "Proceedings of the International Conference on Data Engineering (ICDE)"
    year: 2021
    type: "Demonstration"
    abstract: >-
      Databases are highly optimized complex systems with a multitude of configuration options. Especially in cloud
      scenarios with thousands of database deployments, determining optimized database configurations in an automated
      fashion is of increasing importance for database providers. At the same time, due to increased system complexity,
      it becomes more challenging to identify well-performing configurations. Therefore, research interest in autonomous
      or self-driving database systems has increased enormously in recent years. Such systems promise both performance
      improvements and cost reductions. In the literature, various fully or partially autonomous optimization mechanisms
      exist that optimize single aspects, e.g., index selection. However, database administrators and developers often
      distrust autonomous approaches, and there is a lack of practical experimentation opportunities that could create a
      better understanding. Moreover, the interplay of different autonomous mechanisms under complex workloads remains
      an open question. The presented cockpit enables an interactive assessment of the impact of autonomous components
      for database systems by comparing (autonomous) systems with different configurations side by side. Thereby, the
      cockpit enables users to build trust in autonomous solutions by experimenting with such technologies and observing
      their effects in practice.
    doi: "10.1109/ICDE51399.2021.00304"
