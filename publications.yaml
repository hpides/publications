  - id: "DBLP:journals/pvldb/LiuHRLJWCL14"
    title: "DGFIndex for Smart Grid: Enhancing Hive with a Cost-Effective Multidimensional Range Index"
    authors:
      - "Yue Liu"
      - "Songlin Hu"
      - "Tilmann Rabl"
      - "Wantao Liu"
      - "Hans-Arno Jacobsen"
      - "Kaifeng Wu"
      - "Jian Chen"
      - "Jintao Li"
    venue: "PVLDB 7 (13), 1496-1507"
    year: 2014
    type: "Journal Paper"
    abstract: >-
      In Smart Grid applications, as the number of deployed electric smart meters increases, massive amounts of
      valuable meter data is generated and collected every day. To enable reliable data collection and make business
      decisions fast, high throughput storage and high-performance analysis of massive meter data become crucial for
      grid companies. Considering the advantage of high efficiency, fault tolerance, and price-performance of Hadoop
      and Hive systems, they are frequently deployed as underlying platform for big data processing. However, in
      real business use cases, these data analysis applications typically involve multidimensional range queries
      (MDRQ) as well as batch reading and statistics on the meter data. While Hive is high-performance at complex
      data batch reading and analysis, it lacks efficient indexing techniques for MDRQ. In this paper, we propose
      DGFIndex, an index structure for Hive that efficiently supports MDRQ for massive meter data. DGFIndex divides
      the data space into cubes using the grid file technique. Unlike the existing indexes in Hive, which stores all
      combinations of multiple dimensions, DGFIndex only stores the information of cubes. This leads to smaller
      index size and faster query processing. Furthermore, with pre-computing user-defined aggregations of each
      cube, DGFIndex only needs to access the boundary region for aggregation query. Our comprehensive experiments
      show that DGFIndex can save significant disk space in comparison with the existing indexes in Hive and the
      query performance with DGFIndex is 2-63 times faster than existing indexes in Hive, 2-94 times faster than
      HadoopDB, 2-75 times faster than scanning the whole table in different query selectivity.
    doi: ""
    bibtex: |-
      @article{DBLP:journals/pvldb/LiuHRLJWCL14,
        abstract = {In Smart Grid applications, as the number of deployed electric smart meters increases, massive amounts of valuable meter data is generated and collected every day. To enable reliable data collection and make business decisions fast, high throughput storage and high-performance analysis of massive meter data become crucial for grid companies. Considering the advantage of high efficiency, fault tolerance, and price-performance of Hadoop and Hive systems, they are frequently deployed as underlying platform for big data processing. However, in real business use cases, these data analysis applications typically involve multidimensional range queries (MDRQ) as well as batch reading and statistics on the meter data. While Hive is high-performance at complex data batch reading and analysis, it lacks efficient indexing techniques for MDRQ. In this paper, we propose DGFIndex, an index structure for Hive that efficiently supports MDRQ for massive meter data. DGFIndex divides the data space into cubes using the grid file technique. Unlike the existing indexes in Hive, which stores all combinations of multiple dimensions, DGFIndex only stores the information of cubes. This leads to smaller index size and faster query processing. Furthermore, with pre-computing user-defined aggregations of each cube, DGFIndex only needs to access the boundary region for aggregation query. Our comprehensive experiments show that DGFIndex can save significant disk space in comparison with the existing indexes in Hive and the query performance with DGFIndex is 2-63 times faster than existing indexes in Hive, 2-94 times faster than HadoopDB, 2-75 times faster than scanning the whole table in different query selectivity.},
        author = {Liu, Yue and Hu, Songlin and Rabl, Tilmann and Liu, Wantao and Jacobsen, Hans{-}Arno and Wu, Kaifeng and Chen, Jian and Li, Jintao},
        journal = {{PVLDB}},
        keywords = {PVLDB},
        number = 13,
        pages = {1496-1507},
        title = {DGFIndex for Smart Grid: Enhancing Hive with a Cost-Effective Multidimensional Range Index},
        volume = 7,
        year = 2014
      }
    artifacts:
      "Article": "https://hpi.de/fileadmin/user_upload/90_Research_Groups/rabl/Documents/papers/2014/pvldb2014dgfindex.pdf"

  - id: "DBLP:journals/pvldb/PoessRC14"
    title: "TPC-DI: The First Industry Benchmark for Data Integration"
    authors:
      - "Meikel Poess"
      - "Tilmann Rabl"
      - "Hans-Arno Jacobsen"
      - "Brian Caufield"
    venue: "PVLDB 7 (13), 1367-1378"
    year: 2014
    type: "Journal Paper"
    abstract: >-
      Historically, the process of synchronizing a decision support system with data from operational systems has
      been referred to as Extract, Transform, Load (ETL) and the tools supporting such process have been referred to
      as ETL tools. Recently, ETL was replaced by the more comprehensive acronym, data integration (DI). DI
      describes the process of extracting and combining data from a variety of data source formats, transforming
      that data into a unified data model representation and loading it into a data store. This is done in the
      context of a variety of scenarios, such as data acquisition for business intelligence, analytics and data
      warehousing, but also synchronization of data between operational applications, data migrations and
      conversions, master data management, enterprise data sharing and delivery of data services in a
      service-oriented architecture context, amongst others. With these scenarios relying on up-to-date information
      it is critical to implement a highly performing, scalable and easy to maintain data integration system. This
      is especially important as the complexity, variety and volume of data is constantly increasing and performance
      of data integration systems is becoming very critical. Despite the significance of having a highly performing
      DI system, there has been no industry standard for measuring and comparing their performance. The TPC,
      acknowledging this void, has released TPC-DI, an innovative benchmark for data integration. This paper
      motivates the reasons behind its development, describes its main characteristics including workload, run
      rules, metric, and explains key decisions.
