  - id: "bodner2025ecological"
    title: "A Case for Ecological Efficiency in Database Server Lifecycles"
    authors:
      - "Thomas Bodner"
      - "Martin Boissier"
      - "Tilmann Rabl"
      - "Ricardo Salazar-Díaz"
      - "Florian Schmeller"
      - "Nils Strassenburg"
      - "Ilin Tolovski"
      - "Marcel Weisgut"
      - "Wang Yue"
    venue: "Conference on Innovative Data Systems Research (CIDR)"
    year: 2025
    type: "Conference Paper"
    abstract: >-
      Database systems benefit from hardware performance improvements, but physical manufacturing limits have reduced
      the rate of those gains while software and applications continue to become more complex and resource intensive.
      Given the resource consumption of hardware manufacturing, the ideal hardware lifecycle should become longer.
      This paper estimates efficient lifecycle durations for database hardware. It relates diminishing performance
      improvements, derived from public performance numbers and original benchmarks, to thermal design power and
      combines them with estimates of hardware- and electricity-production carbon intensity. The analysis challenges
      common hardware replacement frequencies and works toward rules of thumb for database-server lifecycles.
