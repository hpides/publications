  - id: "DBLP:conf/lwa/TraubRHRM15"
    title: "Die Apache Flink Plattform zur parallelen Analyse von Datenströmen und Stapeldaten"
    authors:
      - "Jonas Traub"
      - "Tilmann Rabl"
      - "Fabian Hueske"
      - "Till Rohrmann"
      - "Volker Markl"
    venue: "Proceedings of the LWA 2015 Workshops: KDML, FGWM, IR, and FGDB, Trier, Germany, October 7-9, 2015., 403-408"
    year: 2015
    type: "Workshop Paper"
    abstract: >-
      Die Menge an analysierbaren Daten steigt aufgrund fallender Preise für Speicherlösungen und der Erschließung
      neuer Datenquellen rasant. Da klassische Datenbanksysteme nicht ausreichend parallelisierbar sind, können sie
      die heute anfallenden Datenmengen häufig nicht mehr verarbeiten. Hierdurch ist es notwendig spezielle
      Programme zur parallelen Datenanalyse zu verwenden. Die Entwicklung solcher Programme für Computercluster ist
      selbst für erfahrene Systemprogrammierer eine komplexe Herausforderung. Frameworks wie Apache Hadoop MapReduce
      sind zwar skalierbar, aber im Vergleich zu SQL schwer zu programmieren. Die Open-Source Plattform Apache Flink
      schließt die Lücke zwischen herkömmlichen Datenbanksystemen und Big-Data Analyseframeworks. Das Top Level
      Projekt der Apache Software Foundation basiert auf einer fehlertoleranten Laufzeitumgebung zur
      Datenstromverarbeitung, welche die Datenverteilung und Kommunikation im Cluster übernimmt. Verschiedene
      Schnittstellen erlauben die Implementierung von Datenanalyseabläufen für unterschiedlichste Anwendungsfälle.
      Die Plattform wird von einer aktiven Community kontinuierlich weiter entwickelt. Sie ist gleichzeitig Produkt
      und Basis vieler Forschungsarbeiten im Bereich Datenbanken und Informationsmanagement.
