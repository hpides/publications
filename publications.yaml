  - id: "wang2024streamingbenchmarks"
    title: "A Survey of Stream Processing System Benchmarks"
    authors:
      - "Wang Yue"
      - "Martin Boissier"
      - "Tilmann Rabl"
    venue: "Proceedings of the TPC Technology Conference (TPCTC)"
    year: 2024
    type: "Workshop Paper"
    abstract: >-
      Stream processing systems are a fundamental component of modern data processing, enabling timely and eﬃcient
      handling of streaming data. To assess and compare the capabilities of stream processing systems, various
      benchmarks have been proposed over the past years. Examples span a wide range of use cases, ranging from
      benchmarks for enterprise computing to social network analyses and IoT networks. These benchmarks are designed
      with diﬀerent focuses and exhibit different characteristics during execution. In this paper, we review existing
      stream processing benchmarks and analyze them across five dimensions: benchmark type, included workloads, data
      ingestion, supported systems under test (SUT), and tracked metrics. We compare their similarities and diﬀerences,
      providing a comprehensive overview of existing benchmarks. Finally, we discuss aspects that have been overlooked
      and highlight those that should be addressed when benchmarking future generations of streaming systems.
    doi: "10.1007/978-3-031-93858-0_2"
