  - id: "DBLP:conf/icdim/KochRHK07"
    title: "Fast Send Protocol - Minimizing Sending Time in High-Speed Bulk Data Transfers"
    authors:
      - "Christoph Koch"
      - "Tilmann Rabl"
      - "Günther Hölbling"
      - "Harald Kosch"
    venue: "Second IEEE International Conference on Digital Information Management (ICDIM), December 11-13, 2007, Lyon, France, Proceedings, 173-179"
    year: 2007
    type: "Conference Paper"
    abstract: >-
      Over the last decades the Internet traffic has grown dramatically. Besides the number of transfers also the
      data sizes have risen. Traditional transfer protocols do not adapt to this evolution. Large-scale
      computational applications running on expensive parallel computers produce large amounts of data which often
      have to be transferred to weaker machines at the clients’ premises. As parallel computers are frequently
      charged by the minute, it is indispensable to minimize the transfer time after computation succeeded to keep
      down costs. Consequently, the economic focus lies on minimizing the time to move away all data from the
      parallel computer whereas the actual time to arrival remains less (but still) important. This paper describes
      the design and implementation of a new transfer protocol, the Fast Send Protocol (FSP), which uses striping to
      intermediate nodes in order to minimize sending time and to utilize the sender’s resources to a high extent.
