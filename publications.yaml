  - id: "tolovski2026tpcxai"
    title: "TPCx-AI under the Microscope: A Benchmarking Debt Analysis"
    authors:
      - "Ilin Tolovski"
      - "Philipp Hildebrandt"
      - "Khuzaima Daudjee"
      - "Tilmann Rabl"
    venue: "Proceedings of the VLDB Endowment 19 (6), 1305–1318"
    year: 2026
    type: "Conference Paper"
    abstract: >-
      TPCx-AI is an industry standard benchmark for evaluating the end-to-end performance of machine learning systems
      and the underlying hardware configurations. In the database community, individual parts of the dataset and the
      workloads are used to evaluate preprocessing methods and systems for fast inference. Upon analysis of TPCx-AI’s
      dataset and use cases, the authors observe that the official implementation diverges from the specification,
      does not evaluate the capabilities of the system under test, and impacts overall benchmark performance. The
      paper investigates the benchmarking debt accumulated in the dataset and workloads, including runtime and
      quality properties, metric thresholds, workload discrepancies, and data errors. All use cases and datasets are
      shown to contain benchmarking debts, impacting training and serving runtimes by up to 350× and 800×. Addressing
      these debts increases end-to-end throughput by up to 3.8× over the default TPCx-AI implementation.
    doi: "10.14778/3797919.3797936"
