  - id: "heinzl2021integercompression"
    title: "Evaluating Lightweight Integer Compression Algorithms in Column-Oriented In-Memory DBMS"
    authors:
      - "Linus Heinzl"
      - "Ben Hurdelhey"
      - "Martin Boissier"
      - "Michael Perscheid"
      - "Hasso Plattner"
    venue: "Proceedings of the International Workshop on Accelerating Analytics and Data Management Systems Using Modern Processor and Storage Architectures (ADMS @ VLDB)"
    year: 2021
    type: "Workshop Paper"
    abstract: >-
      Lightweight data compression algorithms are often used to decrease memory consumption of in-memory databases. In
      recent years, various integer compression techniques have been proposed that focus on sequential encoding and
      decoding and exploit modern CPUs’ vectorization capabilities. Interestingly, another dominant access pattern in
      databases systems has seen little attention: random access decoding. In this paper, we compare end-to-end database
      performance for various integer compression codecs on three recent CPU architectures. Our evaluation suggests that
      random access performance is often more relevant than vectorization capabilities for sequential accesses. Before
      integrating selected encodings in the database core, we benchmarked seven libraries in an exhaustive standalone
      comparison. We integrated the most promising techniques into the relational in-memory database system Hyrise and 
      evaluated their performance for TPC-H, TPC-DS, and the Join Order Benchmark on three different CPU architectures.
      Our results emphasize the importance of random access decoding. Compared to state-of-the-art dictionary encoding
      in TPC-H, alternatives allow reducing memory consumption of integer columns by up to 53 % while improving runtime
      performance by 5 % on an Intel CPU and over 16 % on an Apple M1.
