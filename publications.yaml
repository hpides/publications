  - id: "salazardiaz2024inferdb"
    title: "InferDB: In-Database Machine Learning Inference Using Indexes"
    authors:
      - "Ricardo Salazar-Díaz"
      - "Boris Glavic"
      - "Tilmann Rabl"
    venue: "Proceedings of the VLDB Endowment 17 (8), 1830–1842"
    year: 2024
    type: "Conference Paper"
    abstract: >-
      The performance of inference with machine learning models and its integration with analytical query processing
      are critical bottlenecks for data analysis. Existing in-database approaches implement preprocessing operators
      and machine learning algorithms natively, transpile them to SQL, or execute user-defined functions in languages
      such as Python. InferDB instead approximates an end-to-end inference pipeline using a lightweight embedding that
      discretizes selected input features and an index that maps points in the embedding space to aggregated model
      predictions. It replaces complex preprocessing and model-based inference with a feature transformation and an
      index lookup, improving inference latency by several orders of magnitude while retaining similar accuracy.
    doi: "10.14778/3659437.3659441"
