  - id: "karimov2020ajoin"
    title: "AJoin: Ad-hoc Stream Joins at Scale"
    authors:
      - "Jeyhun Karimov"
      - "Tilmann Rabl"
      - "Volker Markl"
    venue: "Proceedings of the VLDB Endowment"
    year: 2020
    type: "Conference Paper"
    abstract: >-
      The processing model of state-of-the-art stream processing engines is designed to execute long-running queries
      one at a time. However, with the advance of cloud technologies and multi-tenant systems, multiple users share
      the same cloud for stream query processing. This results in many ad-hoc stream queries sharing common stream
      sources. Many of these queries include joins. There are two main limitations that hinder performing ad-hoc
      stream join processing. The first limitation is missed optimization potential both in stream data processing
      and query optimization layers. The second limitation is the lack of dynamicity in query execution plans. We
      present AJoin, a dynamic and incremental ad-hoc stream join framework. AJoin consists of an optimization layer
      and a stream data processing layer. The optimization layer periodically reoptimizes the query execution plan,
      performing join reordering and vertical and horizontal scaling at run-time without stopping the execution. The
      data processing layer implements pipeline-parallel join architecture. This layer enables incremental and
      consistent query processing supporting all the actions triggered by the optimizer. We implement AJoin on top
      of Apache Flink, an open-source data processing framework. AJoin outperforms Flink not only at ad-hoc
      multi-query workloads but also at single-query workloads.
    doi: ""
    bibtex: |-
      @inproceedings{karimov2020ajoin,
        abstract = {The processing model of state-of-the-art stream processing engines is designed to execute long-running queries one at a time. However, with the advance of cloud technologies and multi-tenant systems, multiple users share the same cloud for stream query processing. This results in many ad-hoc stream queries sharing common stream sources. Many of these queries include joins. There are two main limitations that hinder performing ad-hoc stream join processing. The first limitation is missed optimization potential both in stream data processing and query optimization layers. The second limitation is the lack of dynamicity in query execution plans. We present AJoin, a dynamic and incremental ad-hoc stream join framework. AJoin consists of an optimization layer and a stream data processing layer. The optimization layer periodically reoptimizes the query execution plan, performing join reordering and vertical and horizontal scaling at run-time without stopping the execution. The data processing layer implements pipeline-parallel join architecture. This layer enables incremental and consistent query processing supporting all the actions triggered by the optimizer. We implement AJoin on top of Apache Flink, an open-source data processing framework. AJoin outperforms Flink not only at ad-hoc multi-query workloads but also at single-query workloads.},
        author = {Karimov, Jeyhun and Rabl, Tilmann and Markl, Volker},
        booktitle = {Proceedings of the VLDB Endowment},
        keywords = {joins stream vldb},
        number = 4,
        title = {AJoin: Ad-hoc Stream Joins at Scale},
        volume = 13,
        year = 2020
      }
    artifacts:
      "Paper": "https://hpi.de/fileadmin/user_upload/90_Research_Groups/rabl/Documents/papers/2020/pvldb2020streamjoins.pdf"

