  - id: "boissier2018hybriddatalayouts"
    title: "Hybrid Data Layouts for Tiered HTAP Databases with Pareto-Optimal Data Placements"
    authors:
      - "Martin Boissier"
      - "Rainer Schlosser"
      - "Matthias Uflacker"
    venue: "Proceedings of the International Conference on Data Engineering (ICDE)"
    year: 2018
    type: "Conference Paper"
    abstract: >-
      Recent developments in database research introduced HTAP systems that are capable of handling both transactional
      and analytical workloads. These systems achieve their performance by storing the full data set in main memory. An
      open research question is how far one can reduce the main memory footprint without losing the performance
      superiority of main memory-resident databases. In this paper, we present a hybrid main memory-optimized database
      for mixed workloads that evicts cold data to less expensive storage tiers. It adapts the storage layout to
      mitigate the negative performance impact of secondary storage. A key challenge is to determine which data to place
      on which storage tier. We introduce a novel workload-driven model that determines Pareto-optimal allocations while
      also considering reallocation costs. We evaluate our concept for a production enterprise system as well as
      reproducible data sets.
