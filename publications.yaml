  - id: "maltenberger2022evaluating"
    title: "Evaluating Multi-GPU Sorting with Modern Interconnects"
    authors:
      - "Tobias Maltenberger"
      - "Ivan Ilic"
      - "Ilin Tolovski"
      - "Tilmann Rabl"
    venue: "2022 ACM SIGMOD International Conference on Management of Data (SIGMOD ’22)"
    year: 2022
    type: "Conference Paper"
    abstract: >-
      In recent years, GPUs have become a mainstream accelerator for database operations such as sorting. Most of
      the published GPU- based sorting algorithms are single-GPU approaches. Consequently, they neither harness the
      full computational power nor exploit the high-bandwidth P2P interconnects of modern multi-GPU platforms. In
      particular, the latest NVLink 2.0 and NVLink 3.0-based NVSwitch interconnects promise unparalleled multi-GPU
      acceleration. Re- garding multi-GPU sorting, there are two types of algorithms: GPU- only approaches,
      utilizing P2P interconnects, and heterogeneous strategies that employ the CPU and the GPUs. So far, both types
      have been evaluated at a time when PCIe 3.0 was state-of-the-art. In this paper, we conduct an extensive
      analysis of serial, parallel, and bidirectional data transfer rates to, from, and between multiple GPUs on
      systems with PCIe 3.0, PCIe 4.0, NVLink 2.0, and NVLink 3.0-based NVSwitch interconnects. We measure up to
      35.3× higher parallel P2P copy throughput with NVLink 3.0-powered NVSwitch over PCIe 3.0 interconnects. To
      study multi-GPU sorting on today’s hardware, we implement a P2P-based (P2P sort) and a heteroge- neous (HET
      sort) multi-GPU sorting algorithm and evaluate them on three modern systems. We observe speedups over
      state-of-the- art parallel CPU-based radix sort of up to 14× for P2P sort and 9× for HET sort. On systems with
      high-speed P2P interconnects, we demonstrate that P2P sort outperforms HET sort by up to 1.65×. Finally, we
      show that overlapping GPU copy and compute opera- tions to mitigate the transfer bottleneck does not yield
      performance improvements on modern multi-GPU platforms.
