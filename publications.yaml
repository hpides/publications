  - id: "wang2025dema"
    title: "Dema: Efficient Decentralized Aggregation for Non-Decomposable Quantile Functions"
    authors:
      - "Yue Wang"
      - "Martin Boissier"
      - "Manisha Luthra"
      - "Tilmann Rabl"
    venue: "International Conference on Extending Database Technology (EDBT)"
    year: 2025
    type: "Conference Paper"
    abstract: >-
      The growing number of Internet of Things devices has led to the widespread adoption of decentralized networks
      for unbounded data streams. Traditional stream processors rely on centralized window aggregation, creating
      network overhead and processing bottlenecks. Existing decentralized solutions support decomposable functions
      such as sum and count, but non-decomposable functions such as median and quantile remain difficult because
      partial results cannot be merged without the complete dataset. Dema performs localized sorting and transmits
      statistical summaries instead of raw data. It calculates median and quantile values with up to a 99% reduction
      in network traffic and improves throughput and scalability while retaining accurate results.
