  - id: "DBLP:conf/tpctc/NambiarRK015"
    title: "Enhancing Data Generation in TPCx-HS with a Non-Uniform Random Distribution"
    authors:
      - "Raghunath Nambiar"
      - "Tilmann Rabl"
      - "Karthik Kulkarni"
      - "Michael Frank"
    venue: "Performance Evaluation and Benchmarking: Traditional to Big Data to Internet of Things - 7th TPC Technology Conference, TPCTC 2015, Kohala Coast, HI, USA, August 31 - September 4, 2015. Revised Selected Papers, 94-129"
    year: 2015
    type: "Conference Paper"
    abstract: >-
      Developed by the Transaction Processing Performance Council, the TPC Express Benchmark HS (TPCx-HS) is the
      industry’s first standard for benchmarking big data systems. It is designed to provide an objective measure of
      hardware, operating system and commercial Apache Hadoop File System API compatible software distributions, and
      to provide the industry with verifiable performance, price-performance and availability metrics [1][2]. It can
      be used to compare a broad range of system topologies and implementation methodologies of big data systems in
      a technically rigorous and directly comparable and vendor-neutral manner. The modeled application is simple
      and the results are highly relevant to hardware and software dealing with Big Data systems in general. The
      data generation is derived from TeraGen[3] which uses uniform distribution of data. In this paper the authors
      propose normal distribution (Gaussian distribution) which may be more representative of real life datasets.
      The modified TeraGen and complete changes required to the TPCx-HS kit are included as part of this paper.
