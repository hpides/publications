  - id: "ihde2021survey"
    title: "A Survey of Big Data, High Performance Computing, and Machine Learning Benchmarks"
    authors:
      - "Nina Ihde"
      - "Paula Marten"
      - "Ahmed Eleliemy"
      - "Gabrielle Poerwawinata"
      - "Pedro Silva"
      - "Ilin Tolovski"
      - "M. Florina Ciorba"
      - "Tilmann Rabl"
    venue: "Thirteenth TPC Technology Conference on Performance Evaluation & Benchmarking, TPCTC 2021, 1-21"
    year: 2021
    type: "Conference Paper"
    abstract: >-
      In recent years, there has been a convergence of Big Data (BD), High Performance Computing (HPC), and Machine
      Learning (ML) systems. This convergence is due to the increasing complexity of long data analysis pipelines on
      separated software stacks. With the increasing complexity of data analytics pipelines comes a need to evaluate
      their systems, in order to make informed decisions about technology selection, sizing and scoping of hardware.
      While there are many benchmarks for each of these domains, there is no convergence of these efforts. As a
      first step, it is also necessary to understand how the individual benchmark domains relate. In this work, we
      analyze some of the most expressive and recent benchmarks of BD, HPC, and ML systems. We propose a taxonomy of
      those systems based on individual dimensions such as accuracy metrics and common dimensions such as workload
      type. Moreover, we aim at enabling the usage of our taxonomy in identifying adapted benchmarks for their BD,
      HPC, and ML systems. Finally, we identify challenges and research directions related to the future of
      converged BD, HPC, and ML system benchmarking.
