  - id: "hendrik2024ghostwriter"
    title: "Ghostwriter: a Distributed Message Broker on RDMA and NVM"
    authors:
      - "Makait. Hendrik"
      - "Bonaventura Del Monte"
      - "Tilmann Rabl"
    venue: "15th International Workshop on Accelerating Analytics and Data Management Systems Using Modern Processor and Storage Architectures"
    year: 2024
    type: "Workshop Paper"
    abstract: >-
      Modern stream processing setups heavily rely on message bro- kers such as Apache Kafka or Apache Pulsar. These
      systems act as buffers and re-readable sources for downstream systems or applica- tions. They are typically
      deployed on separate servers, requiring extra resources, and achieve persistence through disk-based storage,
      limiting achievable throughput. In this paper, we present Ghost- writer, a message broker that utilizes remote
      direct memory access (RDMA) and non-volatile memory (NVM) for highly efficient mes- sage transfer and storage.
      Utilizing the hardware characteristics of RDMA and NVM, we achieve data throughput that is only limited by the
      underlying hardware, while reducing computation and dis- aggregating storage and data transfer coordination.
      Ghostwriter achieves performance improvements of up to an order of magnitude in throughput and latency over
      state-of-the-art solutions.
