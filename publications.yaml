  - id: "DBLP:conf/debs/JacobsenMRSKYZ13"
    title: "Grand Challenge: The Bluebay Soccer Monitoring Engine"
    authors:
      - "Hans-Arno Jacobsen"
      - "Kianoosh Mokhtarian"
      - "Tilmann Rabl"
      - "Mohammad Sadoghi"
      - "Reza Sherafat Kazemzadeh"
      - "Young Yoon"
      - "Kaiwen Zhang"
    venue: "The 7th ACM International Conference on Distributed Event-Based Systems, DEBS '13, Arlington, TX, USA - June 29 - July 03, 2013, 295-300"
    year: 2013
    type: "Conference Paper"
    abstract: >-
      This paper presents the design and implementation of a custom-built event processing engine called BlueBay
      developed for live monitoring of soccer games. We experimentally evaluated our system using a real workload
      and report on its performance. Our results indicate that BlueBay achieves a throughput of up to 790k events
      per second, therefore processing the game’s input sensor stream about 60 times faster than real-time. In
      addition to our custom implementation, we also investigated the applicability of off-the-shelf general-purpose
      event processing engines to address the soccer monitoring problem. This effort resulted in two additional and
