  - id: "boissier2021robust"
    title: "Robust and Budget-Constrained Encoding Configurations for In-Memory Database Systems"
    authors:
      - "Martin Boissier"
    venue: "Proceedings of the VLDB Endowment"
    year: 2021
    type: "Conference Paper"
    abstract: >-
      Data encoding has been applied to database systems for decades as it mitigates bandwidth bottlenecks and reduces
      storage requirements. But even in the presence of these advantages, most in-memory database systems use data
      encoding only conservatively as the negative impact on runtime performance can be severe. Real-world systems with
      large parts being infrequently accessed and cost efficiency constraints in cloud environments require solutions
      that automatically and efficiently select encoding techniques, including heavy-weight compression. In this paper,
      we introduce workload-driven approaches to automaticaly determine memory budget-constrained encoding
      configurations using greedy heuristics and linear programming. We show for TPC-H, TPC-DS, and the Join Order
      Benchmark that optimized encoding configurations can reduce the main memory footprint significantly without a loss
      in runtime performance over state-of-the-art dictionary encoding. To yield robust selections, we extend the linear
      programming-based approach to incorporate query runtime constraints and mitigate unexpected performance
      regressions.
