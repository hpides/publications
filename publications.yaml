  - id: "wang2024Phd"
    title: "Efficient Stream Processing in Decentralized Networks"
    authors:
      - "Yue Wang"
    venue: "PhD@ VLDB. 2024"
    year: 2024
    type: "Conference Paper"
    abstract: >-
      Internet-of-things (IoT) devices are widely used in industry as well as in research and are deployed in many
      applications. These massive amounts of devices are connected in large decentralized networks and produce
      unbounded data streams with continuous data. To process these data streams timely, current stream processing
      engines (SPEs) collect all data in a centralized data center. This approach leads to high network utilization
      and can create a bottleneck in the data center, as all data is transmitted via the network and results are
      computed centrally. State-of-the-art solutions push down partial window aggregations to machines that are near
      data streams. However, these solutions are limited to a single simple query. In this paper, we present our
      work on three solutions for different decentralized aggregations: Desis, Deco, and Dema, which significantly
      improve the performance of stream processing in decentralized networks. Our solutions reduce network traffic
      by up to 99.9%.
