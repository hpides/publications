  - id: "delmonte2020rhino"
    title: "Rhino: Efficient Management of Very Large Distributed State for Stream Processing Engines"
    authors:
      - "Bonaventura Del Monte"
      - "Steffen Zeuch"
      - "Tilmann Rabl"
      - "Volker Markl"
    venue: "ACM SIGMOD/PODS International Conference on Management of Data, Portland, OR, USA"
    year: 2020
    type: "Conference Paper"
    abstract: >-
      Scale-out stream processing engines (SPEs) are powering large big data applications on high velocity data
      streams. Industrial setups require SPEs to sustain outages, varying data rates, and low-latency processing.
      SPEs need to transparently reconfigure stateful queries during runtime. However, state-of-the-art SPEs are not
      ready yet to handle on-the-fly reconfigurations of queries with terabytes of state due to three problems.
      These are network overhead for state migration, consistency, and overhead on data processing. In this paper,
      we propose Rhino, a library for efficient reconfigurations of running queries in the presence of very large
      distributed state. Rhino provides a handover protocol and a state migration protocol to consistently and
      efficiently migrate stream processing among servers. Overall, our evaluation shows that Rhino scales with
      state sizes of up to TBs, reconfigures a running query 15 times faster than the state-of- the-art, and reduces
      latency by three orders of magnitude upon a reconfiguration.
    doi: "10.1145/3318464.3389723"
    bibtex: |-
