    title: "Rethinking Stateful Stream Processing with RDMA"
    authors:
      - "Bonaventura Del Monte"
      - "Steffen Zeuch"
      - "Tilmann Rabl"
      - "Volker Markl"
    venue: "ACM SIGMOD International Conference on Management of Data (SIGMOD ’22)"
    year: 2022
    type: "Conference Paper"
    abstract: >-
      Remote Direct Memory Access (RDMA) hardware has bridged the gap between network and main memory speed and thus
      invalidated the common assumption that network is often the bottleneck in distributed data processing systems.
      However, high-speed networks do not provide "plug-and-play" performance (e.g., using IP-overInfiniBand) and
      require a careful co-design of system and application logic. As a result, system designers need to rethink the
      architecture of their data management systems to benefit from RDMA acceleration. In this paper, we focus on
      the acceleration of stream processing engines, which is challenged by real-time constraints and state
      consistency guarantees. To this end, we propose Slash, a novel stream processing engine that uses high-speed
      networks and RDMA to efficiently execute distributed streaming computations. Slash embraces a processing model
      suited for RDMA acceleration and scales out by omitting the expensive data re-partitioning demands of
      scale-out SPEs. While scale-out SPEs rely on data re-partitioning to execute a query over many nodes, Slash
      uses RDMA to share mutable state among nodes. Overall, Slash achieves a throughput improvement up to two
      orders of magnitude over existing systems deployed on an InfiniBand network. Furthermore, it is up to a factor
      of 22 faster than a self-developed solution that relies on RDMA-based data repartitioning to scale out query
      processing.
