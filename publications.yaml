        author = {Das, Pratyoy and Boissier, Martin and Kim, Kyoungmin and Mehrotra, Sharad and Rabl, Tilmann},
        booktitle = {Proceedings of the ACM on Management of Data (PACMMOD, SIGMOD)},
        number = {3},
        pages = {235:1--235:25},
        title = {SmartRabbit: An Interactive Query Processor},
        volume = {4},
        year = {2026}
      }
