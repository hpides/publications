  - id: "hurdelhey2024tierless"
    title: "Workload-Driven Data Placement for Tierless In-Memory Database Systems"
    authors:
      - "Ben Hurdelhey"
      - "Marcel Weisgut"
      - "Martin Boissier"
    venue: "Proceedings of the Datenbanksysteme für Business, Technologie und Web (BTW)"
    year: 2023
    type: "Conference Paper"
    abstract: >-
      High main memory consumption is a significant cost factor for in-memory database systems. Tiering, i.e., placing
      parts of the data on memory or storage devices other than DRAM, reduces the main memory footprint. A controlled
      data placement can assign rarely accessed data to slow devices while frequently used data remains on fast devices,
      such as main memory, to maintain acceptable query latencies. We present an automatic data placement decision
      system for the in-memory database Hyrise. The system organizes the memory and storage devices in a tierless pool,
      with no fixed device class categorization or performance order. The system supports data placement use cases, such
      as minimizing end-to-end query latencies and making cost-optimal purchase recommendations in cloud environments.
      In this paper, we introduce an efficient calibration process to derive cost models for various storage devices. To
      determine data placements, we introduce a linear programming-based approach, which yields optimal configurations,
      and an efficient heuristic. With a set of main memory and SSD devices, we can reduce the main memory consumption
      for base table data of the TPC-DS benchmark by 74 percent when accepting a workload latency increase of 52
      percent. In a comparison of data placement algorithms and cost models, we find that simplistic algorithms (e.g.,
      greedy algorithms) can present viable alternatives to optimal linear programming algorithms, especially under cost
      prediction inaccuracies.
