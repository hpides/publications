        author = {Hu, Songlin and Liu, Wantao and Rabl, Tilmann and Huang, Shuo and Liang, Ying and Xiao, Zheng and Jacobsen, Hans{-}Arno and Pei, Xubin and Wang, Jiye},
        booktitle = {31st {IEEE} International Conference on Data Engineering, {ICDE} 2015, Seoul, South Korea, April 13-17, 2015},
        crossref = {DBLP:conf/icde/2015},
        keywords = {ICDE},
        pages = {1340-1351},
        title = {DualTable: {A} Hybrid Storage Model for Update Optimization in Hive},
        year = 2015
      }
