      - "Tilmann Rabl"
    venue: "Datenbanksysteme für Business, Technologie und Web (BTW)"
    year: 2025
    type: "Conference Paper"
    abstract: >-
      Automating physical design optimizations of database systems is challenging. Recent work on index selection or
      data compression has shown significant advantages of automated approaches, but their impact on running systems
      is often hard to predict and automated systems frequently lack ways to explain their decisions. This
      demonstration studies the impact of optimal encoding configurations for in-memory database systems. Users can
      set different main-memory budgets and directly observe the effects of the resulting encoding configurations on
      runtime performance and memory consumption. They can also analyze how compression changes overall memory use
      and how compression ratios affect performance when memory bandwidth is saturated.
