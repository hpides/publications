  - id: "boissier2016repricing"
    title: "Data-Driven Repricing Strategies in Competitive Markets: An Interactive Simulation Platform"
    authors:
      - "Martin Boissier"
      - "Rainer Schlosser"
      - "Nikolai Podlesny"
      - "Sebastian Serth"
      - "Marvin Bornstein"
      - "Johanna Latt"
      - "Jan Lindemann"
      - "Jan Selke"
      - "Matthias Uflacker"
    venue: "Proceedings of the Eleventh {ACM} Conference on Recommender Systems (RecSys)"
    year: 2016
    type: "Demonstration"
    abstract: >-
      Modern e-commerce platforms pose both opportunities as well as hurdles for merchants. While merchants can observe
      markets at any point in time and automatically reprice their products, they also have to compete simultaneously
      with dozens of competitors. Currently, retailers lack the possibility to test, develop, and evaluate their
      algorithms appropriately before releasing them into the real world. At the same time, it is challenging for
      researchers to investigate how pricing strategies interact with each other under heavy competition. To study
      dynamic pricing competition on online marketplaces, we built an open simulation platform. To be both flexible and
      scalable, the platform has a microservice-based architecture and handles large numbers of competing merchants and
      arriving consumers. It allows merchants to deploy the full width of pricing strategies, from simple rule-based
      strategies to more sophisticated data-driven strategies using machine learning. Our platform enables analyses of
      how a strategy’s performance is affected by customer behavior, price adjustment frequencies, the competitors’
      strategies, and the exit/entry of competitors. Moreover, our platform allows to study the long-term behavior of
      self-adapting strategies.
