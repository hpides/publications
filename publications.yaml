  - id: "streamprocessing"
    title: "Desis: Efficient Window Aggregation in Decentralized Networks"
    authors:
      - "Yue Wang"
      - "Lawrence Benson"
      - "Tilmann Rabl"
    venue: "26th International Conference on Extending Database Technology (EDBT '23)"
    year: 2023
    type: "Conference Paper"
    abstract: >-
      Stream processing is widely applied in industry as well as in research to process unbounded data streams. In
      many use cases, specific data streams are processed by multiple continuous queries. Current systems group
      events of an unbounded data stream into bounded windows to produce results of individual queries in a timely
      fashion. For multiple concurrent queries, multiple concurrent and usually overlapping windows are generated.
      To reduce redundant computations and share partial results, state-of-the-art solutions divide windows into
      slices and then share the results of those slices. However, this is only applicable for queries with the same
      aggregation function and window measure, as in the case of overlaps for sliding windows. For multiple queries
      on the same stream with different aggregation functions and window measures, partial results cannot be shared.
      Furthermore, data streams are produced from devices that are distributed in large decentralized networks.
      Current systems cannot process queries on decentralized data streams efficiently. All queries in a
      decentralized network are either computed centrally or processed individually without exploiting partial
      results across queries. We present Desis, a stream processing system that can efficiently process multiple
      stream aggregation queries. We propose an aggregation engine that can share partial results between multiple
      queries with different window types, measures, and aggregation functions. In decentralized networks, Desis
      moves computation to data sources and shares overlapping computation as early as possible between queries.
      Desis outperforms existing solutions by orders of magnitude in throughput when processing multiple queries and
      can scale to millions of queries. In a decentralized setup, Desis can save up to 99% of network traffic and
      scale performance linearly.
